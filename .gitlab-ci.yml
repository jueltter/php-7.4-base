workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(\d+(\.\d+){0,2}|latest)$/'
    - when: never

stages:
  - build

build_and_push:
  stage: build
  image: docker:29.6.0-cli
  services:
    - name: docker:29.6.0-dind
  tags:
    - shared
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: "$REGISTRY_DOMAIN/development/infrastructure/php-7.4-base/php-7.4-base"
    PUBLIC_IMAGE_NAME: $DOCKER_HUB_USER/php-7.4-base
  before_script:
    - apk add --no-cache ca-certificates
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Build with Dockerfile and push
    - docker build --no-cache --provenance=false --platform linux/amd64 -t $IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG
    # Push to docker hub
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker tag $IMAGE_NAME:$CI_COMMIT_TAG $PUBLIC_IMAGE_NAME:$CI_COMMIT_TAG
    - docker push $PUBLIC_IMAGE_NAME:$CI_COMMIT_TAG
